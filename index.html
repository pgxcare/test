<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>PGxAI Calculator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <div class="calculator-shell">
    <header class="calc-header">
      <span class="badge">PGxAI test</span>
      <div class="header-title">Calculator</div>
    </header>
    <div class="calculator">
      <div class="display">
        <div class="expression" id="expression"></div>
        <div class="result" id="result">0</div>
      </div>
      <div class="buttons">
        <button data-action="clear" class="secondary">C</button>
        <button data-action="backspace" class="secondary">⌫</button>
        <button data-action="percent" class="secondary">%</button>
        <button data-value="/" class="accent">÷</button>

        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button data-value="*" class="accent">×</button>

        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button data-value="-" class="accent">−</button>

        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button data-value="+" class="accent">+</button>

        <button data-value="0" class="wide">0</button>
        <button data-value=".">.</button>
        <button data-action="equals" class="accent">=</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
